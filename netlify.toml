[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Application React Router : rechargement d'une URL interne
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Espace de maquettes : ne pas indexer comme le site de production
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
